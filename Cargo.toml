[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
authors = ["rgg81"]
repository = "https://github.com/rgg81/solana-storm"

[workspace.dependencies]
storm-core = { path = "crates/storm-core" }
storm-solana = { path = "crates/storm-solana" }
storm-store = { path = "crates/storm-store" }
storm-cex = { path = "crates/storm-cex" }
storm-engine = { path = "crates/storm-engine" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = "0.23"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = { version = "0.14", default-features = false, features = ["toml"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

solana-client = "2"
solana-sdk = "2"
spl-token = "8"
rust_decimal = "1"
base64 = "0.22"

proptest = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

# Pulled in transitively by solana-client; we list it here only to enable
# `rustls-tls-native-roots` so the binary trusts the OS CA bundle (corporate
# TLS-inspecting proxies, custom dev CAs, etc.) in addition to webpki-roots.
# Cargo feature unification flips the feature on for the whole build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
